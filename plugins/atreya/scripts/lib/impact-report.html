<script>
(function () {

  // ---------------------------------------------------------------- dependency map

  function dirKey(m) { return m.role === "direct" ? "direct" : (["upstream", "downstream", "both"].indexOf(m.direction) >= 0 ? m.direction : "other"); }
  function visible(m) {

    return true;

})();
